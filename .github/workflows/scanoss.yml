name: SCANOSS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

jobs:
  scanoss-code-scan:
    name: SCANOSS Code Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SCANOSS Code Scan
        id: scanoss-code-scan-step
        uses: scanoss/code-scan-action@v1.3.1
        with:
          policies: copyleft, undeclared, depTrack
          api.url: https://api.scanoss.com/scan/direct
          api.key: ${{ secrets.SC_API_KEY }}
          deptrack.upload: true
          deptrack.url: "https://dependency-track.scanoss.xyz/"
          deptrack.projectname: "integration-demo"
          deptrack.projectversion: "1.0.0"
          deptrack.apikey: ${{ secrets.DT_API_KEY }}
